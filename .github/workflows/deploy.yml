name: Backend Deploy

on:
  push:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: local

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GEMINI_API_KEY
          script: |
            ENV_FILE=/home/ubuntu/profit-logic/profit-logic-backend/.env
            if [ -f "$ENV_FILE" ]; then
              sed -i '/^GEMINI_API_KEY=/d' "$ENV_FILE"
            fi
            echo "GEMINI_API_KEY=${GEMINI_API_KEY}" >> "$ENV_FILE"
            /home/ubuntu/scripts/deploy-backend.sh
            echo "=== Waiting for app startup ==="
            sleep 20
            echo "=== Testing login ==="
            curl -s -X POST http://localhost/api/v1/auth/login -H "Content-Type: application/json" -d '{"email":"admin@profitlogic.com","password":"Test1234!"}' || true
            echo ""
            echo "=== App Logs (last 50 lines) ==="
            cd /home/ubuntu/profit-logic/profit-logic-backend
            docker compose -f docker-compose.prod.yml logs --tail=50 app 2>&1 || true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
