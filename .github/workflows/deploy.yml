name: Backend Deploy

on:
  push:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: local

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GEMINI_API_KEY
          script: |
            cd /home/ubuntu/profit-logic/profit-logic-backend

            # Inject GEMINI_API_KEY into .env
            ENV_FILE=.env
            if [ -f "$ENV_FILE" ]; then
              sed -i '/^GEMINI_API_KEY=/d' "$ENV_FILE"
            fi
            echo "GEMINI_API_KEY=${GEMINI_API_KEY}" >> "$ENV_FILE"

            # Ensure missing DB tables exist (MySQL already running from previous deploy)
            echo "=== Ensuring database tables exist ==="
            docker exec profit-logic-mysql sh -c 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" profit_logic -e "
              CREATE TABLE IF NOT EXISTS reports (
                id BIGINT NOT NULL AUTO_INCREMENT,
                project_id BIGINT NOT NULL,
                \`year_month\` VARCHAR(7) NOT NULL,
                content TEXT NOT NULL,
                tokens_used INT NOT NULL DEFAULT 0,
                created_at DATETIME(6) NOT NULL,
                updated_at DATETIME(6),
                PRIMARY KEY (id),
                UNIQUE KEY uk_reports_project_ym (project_id, \`year_month\`),
                CONSTRAINT fk_reports_project FOREIGN KEY (project_id) REFERENCES projects(id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
              CREATE TABLE IF NOT EXISTS daily_logs (
                id BIGINT NOT NULL AUTO_INCREMENT,
                user_id BIGINT NOT NULL,
                log_date DATE NOT NULL,
                project_summary TEXT,
                cost_summary TEXT,
                time_log_summary TEXT,
                chat_summary TEXT,
                community_summary TEXT,
                personal_memo TEXT,
                auto_generated BIT(1) NOT NULL DEFAULT 0,
                created_at DATETIME(6) NOT NULL,
                updated_at DATETIME(6),
                PRIMARY KEY (id),
                UNIQUE KEY uk_daily_logs_user_date (user_id, log_date),
                CONSTRAINT fk_daily_logs_user FOREIGN KEY (user_id) REFERENCES users(id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
            "' 2>&1 || echo "Table creation skipped (first deploy)"

            # Deploy application
            /home/ubuntu/scripts/deploy-backend.sh

            # Post-deploy verification
            echo "=== Waiting for app startup ==="
            sleep 20
            echo "=== Health Check ==="
            curl -sf http://localhost/api/health && echo "" || echo "WARN: Health check failed"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
