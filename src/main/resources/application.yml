spring:
  application:
    name: profit-logic-backend

  profiles:
    active: local
    include: private

  # Datasource (Docker MySQL)
  datasource:
    url: jdbc:mysql://localhost:3306/profit_logic?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: devuser
    password: devpass
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # Jackson
  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: Asia/Seoul

server:
  port: 8080
  servlet:
    context-path: /api

# Logging
logging:
  level:
    root: INFO
    com.wookidoki.profitlogic: DEBUG
    org.hibernate.SQL: DEBUG

# JWT
jwt:
  secret: ZGV2LXNlY3JldC1rZXktZm9yLXByb2ZpdC1sb2dpYy1hcHBsaWNhdGlvbi0yMDI2
  expiration: 86400000

# CORS
cors:
  allowed-origins: http://localhost:5173
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
