spring:
  application:
    name: profit-logic-backend

  profiles:
    active: local
    include: private

  # Datasource (Docker MySQL)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/profit_logic?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:devuser}
    password: ${SPRING_DATASOURCE_PASSWORD:devpass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # Jackson
  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: Asia/Seoul

server:
  port: 8080
  servlet:
    context-path: /api

# Logging
logging:
  level:
    root: INFO
    com.wookidoki.profitlogic: DEBUG
    org.hibernate.SQL: DEBUG

# JWT
jwt:
  secret: ${JWT_SECRET:ZGV2LXNlY3JldC1rZXktZm9yLXByb2ZpdC1sb2dpYy1hcHBsaWNhdGlvbi0yMDI2}
  expiration: ${JWT_EXPIRATION:86400000}

# LLM
llm:
  provider: gemini
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model-light: gemini-2.5-flash
    model-heavy: gemini-2.5-pro
    max-tokens-light: 1000
    max-tokens-heavy: 4000
    base-url: https://generativelanguage.googleapis.com/v1beta

# CORS
cors:
  allowed-origins: http://localhost:5173
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
