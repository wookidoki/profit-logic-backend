spring:
  application:
    name: profit-logic-backend

  profiles:
    active: local
    include: private

  # JPA
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # Jackson
  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: Asia/Seoul

server:
  port: 8080
  servlet:
    context-path: /api

# Logging
logging:
  level:
    root: INFO
    com.profitlogic: DEBUG
    org.hibernate.SQL: DEBUG

# CORS
cors:
  allowed-origins: http://localhost:5173
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
