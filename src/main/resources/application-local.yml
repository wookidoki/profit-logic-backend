# =============================================================
# LOCAL DEVELOPMENT CONFIGURATION (H2 In-Memory)
# =============================================================

spring:
  datasource:
    url: jdbc:h2:mem:profit_logic_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        globally_quoted_identifiers: false

logging:
  level:
    root: DEBUG
    com.wookidoki.profitlogic: DEBUG
