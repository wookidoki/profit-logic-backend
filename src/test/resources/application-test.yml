spring:
  datasource:
    url: jdbc:h2:mem:profit_logic_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        globally_quoted_identifiers: false

  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: Asia/Seoul

server:
  port: 0
  servlet:
    context-path: /api

jwt:
  secret: dGVzdC1zZWNyZXQta2V5LWZvci1wcm9maXQtbG9naWMtdGVzdC1lbnZpcm9ubWVudC0yMDI2
  expiration: 86400000

cors:
  allowed-origins: http://localhost:5173
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

logging:
  level:
    root: WARN
    com.wookidoki.profitlogic: INFO
